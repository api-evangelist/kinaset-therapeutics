aid: kinaset-therapeutics
name: Kinaset Therapeutics
description: 'Kinaset Therapeutics, Inc. is a clinical-stage biopharmaceutical company based in
  Medfield, Massachusetts, founded in 2020 by Robert Clarke (CEO), Roger Heerman (COO) and Frazer
  Morgan (CDO) to develop novel inhaled therapeutics for severe respiratory disease. Its lead
  candidate, frevecitinib (KN-002), is a dry-powder inhaled pan-JAK inhibitor — potent and balanced
  across JAK1, JAK2, JAK3 and TYK2 — designed as a non-invasive anti-inflammatory add-on to standard
  of care for all severe asthma patients regardless of the underlying cause of inflammation, and
  explored in COPD. The company completed a Phase 1/1b program (NCT05006521), received FDA IND
  clearance, and in July 2026 dosed the first patient in the Phase 2b PANAIRAMA trial (NCT07532265)
  after closing a $103M oversubscribed Series B in January 2026 led by RA Capital Management and
  Forge Life Science Partners, with EQT Life Sciences, Vivo Capital, Schroders Capital, Willett
  Advisors, Pictet Alternative Advisors, Sixty Degree Capital, Atlas Venture, 5AM Ventures and Gimv
  participating on roughly $143M raised to date. Kinaset is a drug developer, not a software company:
  its product is a clinical pipeline, and it publishes no developer program, no public API, no SDKs,
  no webhooks and no machine-readable API contract. Its entire public surface is a 34-page Squarespace
  marketing and investor-news site whose robots.txt disallows every platform JSON view and blocks the
  major AI crawlers by user agent.'
